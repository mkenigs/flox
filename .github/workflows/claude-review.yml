name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  # Completing this workflow wakes the approval check for human reviews,
  # including reviews on fork PRs where repository secrets are unavailable.
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

jobs:
  review:
    # Skip on fork PRs: the review needs CLAUDE_CODE_OAUTH_TOKEN, which isn't
    # available to pull_request runs from forks, so it only fails.
    if: |
      github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'synchronize' || github.base_ref == 'main')
    # One review at a time per PR, and never interrupt one that is already running:
    # the review posts inline comments as it goes, so cancelling mid-flight leaves a
    # half-posted review behind — findings with no summary and no signal that
    # anything was dropped. A second trigger waits instead. Keyed by PR number
    # rather than head ref, because a branch name is not unique to a pull request
    # but the review's unit of work is exactly one.
    concurrency:
      group: claude-review-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required to post reviews
      issues: read
      id-token: write # Required in order for the Claude GitHub app to function
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@12531344451323133b0493233c759991ac61da12 # v1.0.174
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Temporarily uncomment to verify changes to the workflow before
          # merging and without tripping `workflow-must-match-default-branch`
          # validation. Bypasses app-token exchange and posts at GitHub bot.
          #github_token: ${{ secrets.GITHUB_TOKEN }}
          # Allow PRs opened by Bob (flox-forge-agent) to be reviewed; the
          # action rejects bot actors by default.
          allowed_bots: 'flox-forge-agent'
          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          claude_args: |
            --model opus
            --effort xhigh
            --json-schema '{"type":"object","required":["risk","rationale","highest_severity"],"additionalProperties":false,"properties":{"risk":{"enum":["low","medium","high"]},"rationale":{"type":"string"},"highest_severity":{"enum":["none","minor","important","critical"]}}}'
            --dangerously-skip-permissions
            --allowedTools "mcp__github_inline_comment__*,mcp__github_comment__*"
          plugins: 'superpowers@claude-plugins-official'
          track_progress: true
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Review the PR's full diff against its base.
            Use the reviewing-flox-changes skill at
            .agents/skills/reviewing-flox-changes/SKILL.md.

            Fetch whatever git history you need using `gh pr diff`, `gh pr
            view`, or `git fetch`. The current checkout is shallow.

            Reporting requirements:
            - Post each issue as an inline comment on the relevant line using
              the mcp__github_inline_comment__create_inline_comment tool, so
              findings are threaded and individually addressable.
            - Finish by writing the review summary into the tracking comment.
              If there are no issues, say specifically what you reviewed and
              verified rather than a bare "no issues found".
            - Append this feedback request to each inline finding only:
              "Reply in this thread with +1 if this finding was helpful or -1 if it was unhelpful."

            Apply AGENTS.md and each applicable skill explicitly. Start every
            inline finding with exactly **Minor**, **Important** or **Critical**. Report the highest
            severity across all findings in the structured result. Use none
            only after completing the review without findings.
            Use .agents/skills/assessing-pr-risk/SKILL.md for the risk and
            rationale (at most 2000 characters). Include both in the tracking summary. Review the exact head ${{ github.event.pull_request.head.sha }}.

      - name: Record completed assessment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ASSESSMENT: ${{ steps.claude-review.outputs.structured_output }}
        run: |
          jq -e --arg base "$BASE_SHA" 'select(type == "object") + {base: $base}' <<< "$ASSESSMENT" > "$RUNNER_TEMP/assessment.json"
          test -s "$RUNNER_TEMP/assessment.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assessment-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assessment.json
          if-no-files-found: error

name: Flox agent approval
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Run on main so only the app's decision check is attached to the PR head.
  workflow_run:
    workflows: [Claude Code Review]
    types: [requested, completed]

permissions:
  contents: read

jobs:
  reconcile:
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event.action != 'requested' || github.event.workflow_run.event == 'pull_request')
    # Each run reads current GitHub state for all open PRs, so a newer pending
    # run also covers events coalesced while another reconciliation is running.
    concurrency:
      group: flox-agent-approval
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.AGENT_REVIEW_APP_ID }}
          private-key: ${{ secrets.AGENT_REVIEW_PRIVATE_KEY }}
      - run: python3 .github/scripts/agent_approval.py
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DECISION_JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
